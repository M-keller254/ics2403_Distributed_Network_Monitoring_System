// Milestone 11: the same monitoring service as system/rpc/framework.py, described as a gRPC contract.
// Regenerate stubs:  python -m grpc_tools.protoc -I system/rpc --python_out=system/rpc --grpc_python_out=system/rpc system/rpc/monitor.proto
syntax = "proto3";
package monitor;

message SiteReq    { string site = 1; }
message SiteState  { string site = 1; double cpu_pct = 2; double mem_pct = 3; double latency_ms = 4; int64 readings = 5; }
message Reading    { int64 record_id = 1; string site = 2; double cpu_pct = 3; double mem_pct = 4; double rx_mbps = 5; double tx_mbps = 6;
                     double latency_ms = 7; double jitter_ms = 8; double packet_loss_pct = 9; int32 active_users = 10; bool is_anomaly = 11; }
message Batch      { repeated Reading readings = 1; }
message Ack        { int64 accepted = 1; }
message IncReq     { string request_id = 1; string counter = 2; }
message IncResp    { int64 value = 1; }
message StreamReq  { int32 count = 1; }

service Monitor {
  rpc GetSite(SiteReq) returns (SiteState);
  rpc PutReadings(Batch) returns (Ack);
  rpc Increment(IncReq) returns (IncResp);
  rpc StreamReadings(StreamReq) returns (stream Reading);
}
