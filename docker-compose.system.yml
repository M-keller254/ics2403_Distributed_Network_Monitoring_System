# Full system: Users/Devices -> Edge -> Kafka -> Telecom Core (Bully leader) -> Kafka -> Cloud -> Distributed storage
#
#   docker compose -f docker-compose.system.yml up --build -d
#   docker compose -f docker-compose.system.yml logs -f replayer-a replayer-b      # watch the 120,000 rows go through
#   python -m system.scripts.verify_docker                                          # end-to-end check (see README)
#
# Real Apache Kafka (KRaft, single broker) sits BETWEEN the edge and the core (topic edge.telemetry) and again between the
# core and the cloud archiver (topic core.processed). CPU / memory limits come from the compose `cpus` / `mem_limit` keys
# (cgroups), which is how the "CPU capacity" and "memory" capstone variables are applied on a real Docker host.

x-app: &app
  build: { context: ., dockerfile: Dockerfile.system }
  networks: [net]
  restart: unless-stopped
  environment: &env
    BUS: kafka
    KAFKA_BOOTSTRAP: kafka:9092
    TRANSPORT: kafka
    OBJECT_STORE: minio
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_BUCKET: monitoring-data

services:
  kafka:
    image: apache/kafka:3.9.0
    networks: [net]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
    mem_limit: 1g

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    networks: [net]
    ports: ["9000:9000", "9001:9001"]
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    volumes: [minio-data:/data]

  # ---- distributed file system (HDFS-style): 1 namenode + 3 datanodes, replication factor 3
  namenode:
    <<: *app
    command: ["python", "-m", "system.storage.namenode"]
    environment: { PORT: 9000, REPLICATION: 3, META_DIR: /meta }
    volumes: [namenode-meta:/meta]
  datanode1: &dn
    <<: *app
    command: ["python", "-m", "system.storage.datanode"]
    environment: { DN_NAME: dn1, PORT: 9100, PUBLIC_URL: "http://datanode1:9100", NAMENODE_URL: "http://namenode:9000", DATA_DIR: /data }
    volumes: [dn1:/data]
    depends_on: [namenode]
  datanode2:
    <<: *dn
    environment: { DN_NAME: dn2, PORT: 9100, PUBLIC_URL: "http://datanode2:9100", NAMENODE_URL: "http://namenode:9000", DATA_DIR: /data }
    volumes: [dn2:/data]
  datanode3:
    <<: *dn
    environment: { DN_NAME: dn3, PORT: 9100, PUBLIC_URL: "http://datanode3:9100", NAMENODE_URL: "http://namenode:9000", DATA_DIR: /data }
    volumes: [dn3:/data]

  # ---- cloud tier
  cloud:
    <<: *app
    command: ["python", "-m", "system.cloud.service"]
    environment: { PORT: 5002 }
    ports: ["5002:5002"]
  archiver:
    <<: *app
    command: ["python", "-m", "system.cloud.archiver"]
    environment:
      <<: *env
      PORT: 5003
      STORAGE: both
      NAMENODE_URL: http://namenode:9000
    ports: ["5003:5003"]
    depends_on: { kafka: { condition: service_healthy }, namenode: { condition: service_started }, minio: { condition: service_started } }

  # ---- telecom core: 3 replicas, Bully leader election, only the leader consumes
  core1: &core
    <<: *app
    command: ["python", "-m", "system.core.service"]
    environment: &coreenv
      <<: *env
      NODE_ID: 1
      CORE_ID: core-1
      PORT: 5001
      PEERS: "1=http://core1:5001,2=http://core2:5001,3=http://core3:5001"
      CLOUD_URL: http://cloud:5002/digest
      DATA_DIR: /data
      ARCHIVE_TOPIC: core.processed
    volumes: [core1:/data]
    depends_on: { kafka: { condition: service_healthy }, cloud: { condition: service_started } }
    cpus: 1.0
    mem_limit: 512m
  core2:
    <<: *core
    environment: { <<: *coreenv, NODE_ID: 2, CORE_ID: core-2 }
    volumes: [core2:/data]
  core3:
    <<: *core
    environment: { <<: *coreenv, NODE_ID: 3, CORE_ID: core-3 }
    volumes: [core3:/data]

  # ---- edge tier: gateway (publishes to Kafka) + two replayers = the two edge nodes streaming the 120,000-row dataset
  gateway:
    <<: *app
    command: ["python", "-m", "system.edge.gateway"]
    environment:
      <<: *env
      PORT: 5000
      CORE_URLS: "http://core1:5001,http://core2:5001,http://core3:5001"
      ADAPTIVE: "true"          # proposed improvement; set "false" for the baseline
      COMPRESS: zlib
    ports: ["5000:5000"]
    depends_on: { kafka: { condition: service_healthy } }
    cpus: 1.0
    mem_limit: 512m
  replayer-a:
    <<: *app
    command: ["python", "-m", "system.edge.replayer", "--edge", "edge-node-a", "--gateway", "http://gateway:5000", "--chunk", "2000"]
    restart: "no"
    depends_on: [gateway, core1, core2, core3]
  replayer-b:
    <<: *app
    command: ["python", "-m", "system.edge.replayer", "--edge", "edge-node-b", "--gateway", "http://gateway:5000", "--chunk", "2000"]
    restart: "no"
    depends_on: [gateway, core1, core2, core3]

  # ---- BASELINE (Week 1-2 design): one flat collector, no Kafka. Start with:  --profile baseline
  baseline-collector:
    <<: *app
    command: ["python", "-m", "system.baseline.collector"]
    environment: { PORT: 5100 }
    ports: ["5100:5100"]
    profiles: [baseline]

networks:
  net: {}
volumes:
  minio-data: {}
  namenode-meta: {}
  dn1: {}
  dn2: {}
  dn3: {}
  core1: {}
  core2: {}
  core3: {}
