x-agent: &agent
  build: ./agent
  networks: [monitor-net]

services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports: ["9094:9094"]
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,HOST://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 12
      start_period: 90s
    networks: [monitor-net]

  nameserver:
    build: ./nameserver
    container_name: nameserver
    ports: ["9000:9000"]
    mem_limit: 64m
    cpus: 0.2
    networks: [monitor-net]

  collector:
    build: ./collector
    container_name: collector-1
    ports: ["5000:5000"]
    networks: [monitor-net]
  aggregator-1:
    build: ./aggregator
    container_name: aggregator-1
    environment:
      AGG_ID: "1"
      PORT: "6000"
      PEERS: "http://aggregator-2:6000"
      CLOUD_URL: http://collector:5000/report
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: monitoring.reports
    ports: ["6001:6000"]
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      collector:
        condition: service_started
      kafka:
        condition: service_healthy
    networks: [monitor-net]
  aggregator-2:
    build: ./aggregator
    container_name: aggregator-2
    environment:
      AGG_ID: "2"
      PORT: "6000"
      PEERS: "http://aggregator-1:6000"
      CLOUD_URL: http://collector:5000/report
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: monitoring.reports
    ports: ["6002:6000"]
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      collector:
        condition: service_started
      kafka:
        condition: service_healthy
    networks: [monitor-net]
  edge-node-a:
    <<: *agent
    container_name: edge-node-a-1
    environment:
      NODE_NAME: edge-node-a
      NODE_ROLE: edge
      COLLECTOR_URL: "http://aggregator-1:6000/report,http://aggregator-2:6000/report"
      WINDOW_SIZE: "5"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: monitoring.reports
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      aggregator-1:
        condition: service_started
      aggregator-2:
        condition: service_started
      kafka:
        condition: service_healthy
  edge-node-b:
    <<: *agent
    container_name: edge-node-b-1
    environment:
      NODE_NAME: edge-node-b
      NODE_ROLE: edge
      COLLECTOR_URL: "http://aggregator-1:6000/report,http://aggregator-2:6000/report"
      WINDOW_SIZE: "5"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: monitoring.reports
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      aggregator-1:
        condition: service_started
      aggregator-2:
        condition: service_started
      kafka:
        condition: service_healthy
  core-node:
    <<: *agent
    container_name: core-node-1
    environment:
      NODE_NAME: core-node
      NODE_ROLE: core
      COLLECTOR_URL: "http://collector:5000/report"
      WINDOW_SIZE: "5"
    mem_limit: 256m
    cpus: 1.0
    depends_on: [collector]

  store-a:
    build: ./store
    container_name: store-a
    environment:
      STORE_ID: "A"
      PORT: "7001"
      NAME_SERVER: "http://nameserver:9000"
      OWN_URL: "http://store-a:7001"
    ports: ["7001:7001"]
    depends_on: [nameserver]
    networks: [monitor-net]

  store-b:
    build: ./store
    container_name: store-b
    environment:
      STORE_ID: "B"
      PORT: "7002"
      NAME_SERVER: "http://nameserver:9000"
      OWN_URL: "http://store-b:7002"
    ports: ["7002:7002"]
    depends_on: [nameserver]
    networks: [monitor-net]

  txn-coordinator:
    build: ./txn-coordinator
    container_name: txn-coordinator
    environment:
      PARTICIPANTS: "http://store-a:7001,http://store-b:7002"
      PORT: "7000"
    ports: ["7000:7000"]
    depends_on: [store-a, store-b]
    networks: [monitor-net]

  gateway:
    build: ./gateway
    container_name: gateway
    environment:
      REPLICAS: "http://store-a:7001,http://store-b:7002"
      NAME_SERVER: "http://nameserver:9000"
      LOGICAL_NAMES: "store-a,store-b"
    ports: ["8000:8000"]
    depends_on: [store-a, store-b, nameserver]
    mem_limit: 96m
    cpus: 0.3
    networks: [monitor-net]

networks:
  monitor-net:
    driver: bridge

volumes:
  kafka_data:
